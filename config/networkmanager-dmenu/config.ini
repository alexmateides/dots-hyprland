# networkmanager_dmenu (https://github.com/firecat53/networkmanager-dmenu)
# Options not listed here use the upstream defaults (see config.ini.example in the repo)

[dmenu]
# -dmenu and -p are added by networkmanager_dmenu itself
dmenu_command = rofi -i -theme ~/.config/rofi/menus/network/center.rasi
# Mark the active connection with rofi's -a highlighting instead of "=="
highlight = True
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {icon}  {name:<{max_len_name}}  {sec}
list_saved = False
prompt = Networks

[dmenu_passphrase]
# Uses rofi -password so the passphrase is masked
obscure = True
show_pass = kitty --hold -e nmcli device wifi show-password

[editor]
terminal = kitty
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 5
