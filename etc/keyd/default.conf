# Copilot key (T14s g6) sends LeftMeta+LeftShift+F23 -> remap to Right Alt (AltGr in cz/coder)
# PgUp/PgDn (next to the arrows) -> Home/End; Fn+PgUp/PgDn sends nothing (eaten by firmware),
# so Alt+PgUp/PgDn gives the original PgUp/PgDn
[ids]
# internal "AT Translated Set 2 keyboard" only
0001:0001

[main]
leftshift+leftmeta+f23 = rightalt
pageup = home
pagedown = end

[alt]
pageup = pageup
pagedown = pagedown
